<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Đăng ký - Gợi ý món ăn</title>

    <link rel="stylesheet"
          href="{{ url_for('static', filename='css/style.css') }}">
</head>

<body>

<div class="login-container">

    <div class="login-box">

        <h1>Đăng ký</h1>

        <p class="login-subtitle">
            Tạo tài khoản để sử dụng website
        </p>


        <!-- Thông báo từ Flask -->
        {% with messages = get_flashed_messages(with_categories=true) %}
            {% if messages %}

                {% for category, message in messages %}

                    <div class="alert {{ category }}">
                        {{ message }}
                    </div>

                {% endfor %}

            {% endif %}
        {% endwith %}


        <form id="registerForm"
              action="{{ url_for('register') }}"
              method="POST">


            <!-- HỌ TÊN -->
            <div class="form-group">

                <label for="hoten">
                    Họ và tên
                </label>

                <input
                    type="text"
                    id="hoten"
                    name="hoten"
                    placeholder="Nhập họ và tên"
                    required
                >

                <small id="nameError"
                       class="error-message"></small>

            </div>


            <!-- EMAIL -->
            <div class="form-group">

                <label for="email">
                    Email
                </label>

                <input
                    type="email"
                    id="email"
                    name="email"
                    placeholder="Nhập email"
                    autocomplete="email"
                    required
                >

                <small id="registerEmailError"
                       class="error-message"></small>

            </div>


            <!-- MẬT KHẨU -->
            <div class="form-group">

                <label for="matkhau">
                    Mật khẩu
                </label>

                <div class="password-wrapper">

                    <input
                        type="password"
                        id="registerPassword"
                        name="matkhau"
                        placeholder="Nhập mật khẩu"
                        autocomplete="new-password"
                        required
                    >

                    <button
                        type="button"
                        id="toggleRegisterPassword"
                        class="toggle-password">

                        Hiện

                    </button>

                </div>

                <small id="registerPasswordError"
                       class="error-message"></small>

            </div>


            <!-- NHẬP LẠI MẬT KHẨU -->
            <div class="form-group">

                <label for="xacnhanmatkhau">
                    Xác nhận mật khẩu
                </label>

                <input
                    type="password"
                    id="xacnhanmatkhau"
                    name="xacnhanmatkhau"
                    placeholder="Nhập lại mật khẩu"
                    autocomplete="new-password"
                    required
                >

                <small id="confirmPasswordError"
                       class="error-message"></small>

            </div>


            <!-- BUTTON -->
            <button
                type="submit"
                id="registerButton"
                class="login-button">

                Đăng ký

            </button>

        </form>


        <!-- LINK ĐĂNG NHẬP -->
        <div class="register-link">

            <span>Đã có tài khoản?</span>

            <a href="{{ url_for('login') }}">
                Đăng nhập
            </a>

        </div>

    </div>

</div>


<script src="{{ url_for('static', filename='js/main.js') }}"></script>

</body>
</html>
